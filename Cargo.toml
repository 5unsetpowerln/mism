[package]
name = "mism"
version = "0.1.0"
edition = "2024"
description = "Minecraft server manager for Paper and Folia"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
nix = { version = "0.31.3", features = ["fs", "poll", "process", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = { version = "0.4.5", default-features = false }
thiserror = "2.0.21"
toml = "1.1.8"
ureq = { version = "~3.4", default-features = false, features = ["rustls"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
nix = { version = "0.31.3", features = ["term"] }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
