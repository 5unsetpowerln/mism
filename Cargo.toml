[package]
name = "mmmm"
version = "0.1.0"
edition = "2024"
description = "Minecraft server manager for Paper and Folia"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
nix = { version = "0.31.3", features = ["fs", "process", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = { version = "0.4.5", default-features = false }
thiserror = "2.0.21"
toml = "1.1.8"
ureq = { version = "~3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
